<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Brosur Digital</title>
<link rel="stylesheet" href="style.css"></head><body><main class="wide">
<h1>Brosur Digital</h1><p class="sub">Pilih brosur untuk dibaca.</p>
<div id="grid" class="grid" aria-live="polite"></div><p id="empty" class="sub" hidden>Belum ada brosur yang diterbitkan.</p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const th=(u,w)=>u.replace("/upload/",`/upload/f_auto,q_auto,w_${w}/`);
firebase.initializeApp(CFG.firebase);
firebase.firestore().collection("flipbooks").orderBy("createdAt","desc").get().then(s=>{
 if(s.empty)return document.getElementById("empty").hidden=false;
 s.forEach(d=>{const b=d.data(),a=document.createElement("a");a.className="card";a.href="view.html?id="+d.id;
  a.innerHTML=`<img alt="" loading="lazy" src="${th(b.pages[0].url,400)}"><div><b></b><small>${b.pages.length} halaman</small></div>`;
  a.querySelector("b").textContent=b.title;document.getElementById("grid").append(a)})
}).catch(()=>{document.getElementById("empty").textContent="Brosur tidak dapat dimuat saat ini.";document.getElementById("empty").hidden=false});
</script></body></html>
