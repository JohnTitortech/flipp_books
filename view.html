<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Flipbook</title>
<link rel="stylesheet" href="style.css"></head><body class="v">
<a id="ttl" href="index.html" style="color:inherit;text-decoration:none"></a><div id="stage"><div id="book"></div></div>
<div id="bar"><button id="pv" aria-label="Halaman sebelumnya">Sebelumnya</button><span id="cnt">–</span>
<button id="nx" aria-label="Halaman berikutnya">Berikutnya</button><button id="fs">Layar penuh</button></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),th=(u,w)=>u.replace("/upload/",`/upload/f_auto,q_auto,w_${w}/`);
(async()=>{try{
 firebase.initializeApp(CFG.firebase);
 const d=await firebase.firestore().collection("flipbooks").doc(new URLSearchParams(location.search).get("id")||"x").get();
 if(!d.exists)throw 0;const b=d.data();document.title=b.title;$("ttl").textContent=b.title;
 const w=550,h=Math.round(w*b.pages[0].h/b.pages[0].w),N=b.pages.length;
 const pf=new St.PageFlip($("book"),{width:w,height:h,size:"stretch",minWidth:260,maxWidth:900,minHeight:360,maxHeight:1300,showCover:true,usePortrait:true,maxShadowOpacity:.4,mobileScrollSupport:false});
 pf.loadFromImages(b.pages.map(p=>th(p.url,1400)));
 const upd=()=>$("cnt").textContent=`${pf.getCurrentPageIndex()+1} / ${N}`;upd();pf.on("flip",upd);
 $("pv").onclick=()=>pf.flipPrev();$("nx").onclick=()=>pf.flipNext();
 $("fs").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
 addEventListener("keydown",e=>{if(e.key==="ArrowRight")pf.flipNext();if(e.key==="ArrowLeft")pf.flipPrev()});
}catch(e){$("stage").innerHTML="<p>Flipbook tidak ditemukan.</p>"}})();
</script></body></html>
