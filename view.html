<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Brosur</title>
<link rel="stylesheet" href="style.css"></head><body class="v">
<div id="stage"></div>
<div id="bar"><a href="index.html">Galeri</a><button id="pv" aria-label="Halaman sebelumnya">Sebelumnya</button><span id="cnt">–</span>
<button id="nx" aria-label="Halaman berikutnya">Berikutnya</button></div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),th=(u,w)=>u.replace("/upload/",`/upload/f_auto,q_auto:best,c_limit,w_${w}/`);
(async()=>{try{
 firebase.initializeApp(CFG.firebase);
 const d=await firebase.firestore().collection("flipbooks").doc(new URLSearchParams(location.search).get("id")||"x").get();
 if(!d.exists)throw 0;const b=d.data();document.title=b.title;
 const N=b.pages.length,ar=b.pages[0].w/b.pages[0].h,urls=b.pages.map(p=>th(p.url,2400));
 let pf=null,cur=0,t;
 const upd=()=>$("cnt").textContent=`${pf.getCurrentPageIndex()+1} / ${N}`;
 const build=()=>{
  if(pf){cur=pf.getCurrentPageIndex();pf.destroy()}
  const st=$("stage");st.innerHTML="";
  const w=Math.floor(Math.min(st.clientWidth-16,(st.clientHeight-16)*ar)),h=Math.floor(w/ar),el=document.createElement("div");
  el.style.cssText=`width:${w}px;height:${h}px`;st.append(el);
  pf=new St.PageFlip(el,{width:w,height:h,size:"fixed",usePortrait:true,showCover:false,maxShadowOpacity:.3,flippingTime:600,mobileScrollSupport:false});
  pf.loadFromImages(urls);pf.on("flip",upd);if(cur)pf.turnToPage(cur);upd()};
 build();
 addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(build,200)});
 $("pv").onclick=()=>pf.flipPrev();$("nx").onclick=()=>pf.flipNext();
 addEventListener("keydown",e=>{if(e.key==="ArrowRight")pf.flipNext();if(e.key==="ArrowLeft")pf.flipPrev()});
}catch(e){$("stage").innerHTML="<p>Brosur tidak ditemukan.</p>"}})();
</script></body></html>
